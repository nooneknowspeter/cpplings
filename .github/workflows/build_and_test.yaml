name: Build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: build
        run: |
          nix develop --impure -c zig build

      - name: tests
        run: |
          nix develop --impure -c zig build run -Dtests
